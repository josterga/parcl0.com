  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .divider { border: none; width: 100%; max-width: 720px; padding: 0 10%; box-sizing: border-box; }

    .divider-heavy { border-top: 2px solid #fff; margin: 32px 0 0; }
    .divider-light { border-top: 1px solid #333; margin: 32px 0 0; }
    #projects-root {
      width: 100%; max-width: 720px; padding: 0 10%;
      display: flex; flex-direction: column; align-items: center;
    }
    .project { width: 100%; text-align: center; padding: 32px 0 0; }
    .project-title { color: #fff; font-size: clamp(12px, 1.2vw, 16px); margin-bottom: 2px; }
    .project-title a { color: #fff; text-decoration: underline; }
    .project-title a:hover { opacity: 0.8; }
    .project-tags { color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .project-desc { color: #9e9e9e; font-size: clamp(12px, 1.2vw, 14px); line-height: 1.5; }
    .project-images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
    .project-images img { max-height: 200px; max-width: 100%; object-fit: contain; cursor: zoom-in; }
    #lightbox {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 100; align-items: center; justify-content: center; cursor: zoom-out;
    }
    #lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
